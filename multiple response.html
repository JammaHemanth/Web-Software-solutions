<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<title>Online Test-II Answers</title>
</head>
<body>
<main class="container py-4">
  <div class="glass-card p-4 p-md-5" style="animation: scaleIn 0.5s ease;">
    <header class="mb-4">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-3">
        <div>
          <h2 class="text-white fw-bold mb-0"><i class="fas fa-check-circle me-2" style="color:var(--accent);"></i>Online Test-II</h2>
          <small style="color:var(--text-muted);">Programming Answer Review</small>
        </div>
        <div class="d-flex align-items-center gap-3">
          <div class="score-ring-sm" id="scoreRingSm">
            <span id="scoreTextSm">15/15</span>
          </div>
          <span class="badge" id="qCounter" style="background:var(--gradient);font-size:0.85rem;padding:0.5rem 1rem;">
            <i class="fas fa-question-circle me-1"></i>1 / 15
          </span>
        </div>
      </div>
    </header>

    <div class="row justify-content-center mb-3">
      <div class="col-auto">
        <div class="text-center">
          <div class="score-ring" id="scoreRing" style="--pct:360deg;">
            <div class="score-text" id="scoreText">15/15</div>
          </div>
          <p class="text-white-50 mb-0" style="font-size:0.85rem;">Correct Answers</p>
        </div>
      </div>
    </div>

    <div class="progress-bar-custom">
      <div class="progress-fill" id="reviewProgress" style="width:100%;"></div>
    </div>

    <div class="progress-tracker" id="reviewDots"></div>

    <div id="answerContainer" class="quiz-card correct" style="min-height:360px;"></div>

    <div class="d-flex justify-content-between align-items-center mt-4 flex-wrap gap-2">
      <button type="button" class="btn btn-outline-light px-4" id="prevBtn" disabled>
        <i class="fas fa-arrow-left me-1"></i>Previous
      </button>
      <button type="button" class="btn btn-gradient px-4" id="nextBtn">
        Next<i class="fas fa-arrow-right ms-1"></i>
      </button>
    </div>

    <div class="text-center mt-4">
      <a href="feedback1.html" class="btn btn-gradient btn-lg"><i class="fas fa-check me-2"></i>Continue</a>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const data = [
  { id:1, text:'Who is the father of C language?', correct:'c', options:[{l:'a',t:'Steve Jobs'},{l:'b',t:'James Gosling'},{l:'c',t:'Dennis Ritchie'},{l:'d',t:'Rasmus Lerdorf'}], explanation:'Dennis Ritchie is the father of C Programming Language. C programming language was developed in 1972 at American Telephone &amp; Telegraph Bell Laboratories of USA.', expanded:true },
  { id:2, text:'What is the use of the &lt;noscript&gt; tag in Javascript?', correct:'d', options:[{l:'a',t:'The content are displayed by non-JS-based browser'},{l:'b',t:'Clear all cookies and cache'},{l:'c',t:'Both A and B'},{l:'d',t:'None of the above'}], explanation:'Since only underscore and no other special character is allowed in a variable name, it results in an error.' },
  { id:3, text:'What is/are the correct value(s) of font-weight property?', correct:'c', options:[{l:'a',t:'bold, italic, underline'},{l:'b',t:'normal, bold, italic'},{l:'c',t:'normal, bold, bolder, lighter, initial, and inherit'},{l:'d',t:'None of the above'}], explanation:'The valid values of the font-weight property:\nnormal\nbold\nbolder\nlighter\ninitial\ninherit' },
  { id:4, text:'Which of these classes helps make a text stand out?', correct:'b', options:[{l:'a',t:'small'},{l:'b',t:'lead'},{l:'c',t:'text-center'},{l:'d',t:'text-left'}], explanation:'None.' },
  { id:5, text:'Functions in C Language are always _________', correct:'b', options:[{l:'a',t:'Internal'},{l:'b',t:'External'},{l:'c',t:'Both Internal and External'},{l:'d',t:'External and Internal are not valid terms for functions'}], explanation:'None' },
  { id:6, text:'What do we call after initializing a plug-in to get A scripting interface?', correct:'c', options:[{l:'a',t:'NP_GetMIMEDescription'},{l:'b',t:'NP_Initialize'},{l:'c',t:'NPP_GetValue'},{l:'d',t:'NP_GetValue'}], explanation:'None' },
  { id:7, text:'Which of the following below live on the heap in java?', correct:'c', options:[{l:'a',t:'Class'},{l:'b',t:'Instance variable'},{l:'c',t:'Object'},{l:'d',t:'Method'}], explanation:'None' },
  { id:8, text:'Which of these interface handle sequences?', correct:'b', options:[{l:'a',t:'Set'},{l:'b',t:'List'},{l:'c',t:'Comparator'},{l:'d',t:'Collection'}], explanation:'None' },
  { id:9, text:'What is true of the finalize() method?', correct:'a', options:[{l:'a',t:'It may be called zero or one times.'},{l:'b',t:'It may be called zero or more times.'},{l:'c',t:'It will be called exactly once.'},{l:'d',t:'It may be called one or more times.'}], explanation:'The finalize() method may not be called, such as if your program crashes. However, it is guaranteed to be called no more than once.' },
  { id:10, text:'Which of the following is true about primitives?', correct:'b', options:[{l:'a',t:'You can call methods on a primitive.'},{l:'b',t:'You can convert a primitive to a wrapper class object simply by assigning it.'},{l:'c',t:'You can convert a wrapper class object to a primitive by calling valueOf().'},{l:'d',t:'You can store a primitive directly into an ArrayList.'}], explanation:'You can convert a primitive to a wrapper class object simply by assigning it' },
  { id:11, text:'Where is Client-side JavaScript code embedded within HTML documents?', correct:'b', options:[{l:'a',t:'A URL that uses the special javascript:code'},{l:'b',t:'A URL that uses the special javascript:protocol'},{l:'c',t:'A URL that uses the special javascript:encoding'},{l:'d',t:'A URL that uses the special javascript:stack'}], explanation:'The Client-side JavaScript code is embedded within HTML documents in four ways:\n1. Inline, between a pair of "script" tags\n2. From an external file specified by the src attribute of a "script" tag\n3. In an HTML event handler attribute, such as onclick or onmouseover\n4. In a URL that uses the special javascript: protocol.' },
  { id:12, text:'Which CSS property specifies an image as the list item marker?', correct:'a', options:[{l:'a',t:'list-style-image'},{l:'b',t:'list-style-picture'},{l:'c',t:'list-style-background'},{l:'d',t:'list-style-bgimage'}], explanation:'The list-style-image property specifies an image as the list item marker.\n\nExample:\n\nul {\n  list-style-image: url(\'sqpurple.gif\');\n}' },
  { id:13, text:'Which of the following is correct about Bootstrap cross-browser consistency?', correct:'d', options:[{l:'a',t:'Bootstrap uses Normalize to establish cross-browser consistency.'},{l:'b',t:'Normalize.css is a modern, HTML5-ready alternative to CSS resets.'},{l:'c',t:'Normalize.css a small CSS file to get better cross-browser consistency in the default styling of HTML'},{l:'d',t:'All of the above'}], explanation:'None' },
  { id:14, text:'Which of the following is correct about Bootstrap?', correct:'d', options:[{l:'a',t:'Bootstrap\'s responsive CSS adjusts to Desktops, Tablets, and Mobiles.'},{l:'b',t:'Provides a clean and uniform solution for building an interface for developers.'},{l:'c',t:'It contains beautiful and functional built-in components which are easy to customize.'},{l:'d',t:'All of the above'}], explanation:'None' },
  { id:15, text:'Which CSS property is used to specify uppercase and lowercase letters in a text?', correct:'a', options:[{l:'a',t:'text-transform'},{l:'b',t:'text-case'},{l:'c',t:'case'},{l:'d',t:'text-casing'}], explanation:'The text-transform property is used to specify uppercase and lowercase letters in a text.\n\nExample:\n\np {\n  text-transform: uppercase / lowercase / capitalize;\n}' }
];

const TOTAL = data.length;
let currentIdx = 0;

function renderCard() {
  const q = data[currentIdx];
  const container = document.getElementById('answerContainer');
  const opts = q.options.map(o => {
    const isCorrect = o.l === q.correct;
    return `<div class="form-check">
      <input type="radio" class="form-check-input" name="q${q.id}" id="q${q.id}${o.l}" disabled ${isCorrect ? 'checked' : ''}>
      <label class="form-check-label" for="q${q.id}${o.l}" ${isCorrect ? 'style="color:#22c55e;font-weight:600;"' : ''}>${isCorrect ? '<i class="fas fa-check-circle me-1"></i>' : ''}${o.t}</label>
    </div>`;
  }).join('');

  container.style.opacity = '0';
  container.style.transform = 'translateX(20px)';
  setTimeout(() => {
    container.innerHTML = `
      <div class="d-flex justify-content-between align-items-start mb-3">
        <label class="fw-bold" style="color:#fff;font-size:1.05rem;">${q.id}. ${q.text}</label>
        <span class="badge" style="background:#22c55e;"><i class="fas fa-check me-1"></i>Correct</span>
      </div>
      ${opts}
      <details ${q.expanded ? 'open' : ''}>
        <summary><i class="fas fa-lightbulb me-1"></i> Answer</summary>
        <p class="mt-2 mb-0" style="color:rgba(255,255,255,0.8);">Answer: ${q.correct}<br>Explanation: ${q.explanation}</p>
      </details>`;
    container.style.transition = 'all 0.35s ease';
    container.style.opacity = '1';
    container.style.transform = 'translateX(0)';
  }, 50);

  document.getElementById('qCounter').innerHTML = `<i class="fas fa-question-circle me-1"></i>${currentIdx+1} / ${TOTAL}`;
  document.getElementById('prevBtn').disabled = currentIdx === 0;
  document.getElementById('nextBtn').style.display = currentIdx === TOTAL - 1 ? 'none' : 'inline-flex';
  updateDots();
}

function updateDots() {
  const dots = document.querySelectorAll('.progress-dot');
  dots.forEach((d, i) => {
    d.className = 'progress-dot completed';
    if (i === currentIdx) d.classList.add('active');
  });
}

function buildDots() {
  const container = document.getElementById('reviewDots');
  container.innerHTML = '';
  for (let i = 0; i < TOTAL; i++) {
    const d = document.createElement('div');
    d.className = 'progress-dot completed';
    d.textContent = i + 1;
    d.addEventListener('click', () => { currentIdx = i; renderCard(); });
    container.appendChild(d);
  }
}

function nextCard() { if (currentIdx < TOTAL - 1) { currentIdx++; renderCard(); } }
function prevCard() { if (currentIdx > 0) { currentIdx--; renderCard(); } }

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextCard();
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prevCard();
});

document.getElementById('nextBtn').addEventListener('click', nextCard);
document.getElementById('prevBtn').addEventListener('click', prevCard);

buildDots();
renderCard();
</script>
</body>
</html>
